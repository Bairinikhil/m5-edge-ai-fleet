<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">M5 Edge-AI Fleet architecture</title>
  <desc id="desc">M5 devices and simulated devices publish health, inference, and OTA events through MQTT to a fleet registry, SQLite, and local API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#152f45"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#142d44"/><stop offset="1" stop-color="#1e4660"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#69e6c1"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="56" y="65" fill="#69e6c1" font-family="Arial,sans-serif" font-size="30" font-weight="700">M5 Edge-AI Fleet</text>
  <text x="56" y="98" fill="#a9c2d8" font-family="Arial,sans-serif" font-size="17">One local control plane for health, inference, and OTA visibility</text>
  <g filter="url(#shadow)" font-family="Arial,sans-serif">
    <rect x="55" y="150" width="260" height="280" rx="18" fill="url(#card)" stroke="#315878"/>
    <rect x="375" y="150" width="225" height="280" rx="18" fill="url(#card)" stroke="#315878"/>
    <rect x="660" y="150" width="225" height="280" rx="18" fill="url(#card)" stroke="#315878"/>
    <rect x="945" y="150" width="200" height="280" rx="18" fill="url(#card)" stroke="#315878"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#fff">
    <text x="80" y="196" fill="#69e6c1" font-size="19" font-weight="700">DEVICES</text>
    <circle cx="90" cy="240" r="9" fill="#69e6c1"/><text x="112" y="247" font-size="17">m5-device-01</text><text x="112" y="270" fill="#b6cde0" font-size="14">real M5CoreS3</text>
    <circle cx="90" cy="310" r="9" fill="#8aa9c0"/><text x="112" y="317" font-size="17">sim-m5-01</text><text x="112" y="340" fill="#b6cde0" font-size="14">development fixture</text>
    <circle cx="90" cy="380" r="9" fill="#8aa9c0"/><text x="112" y="387" font-size="17">sim-m5-02 / 03</text>
    <text x="400" y="196" fill="#69e6c1" font-size="19" font-weight="700">MQTT</text>
    <text x="400" y="245" font-size="16">devices/+ /health</text><text x="400" y="285" font-size="16">devices/+ /inference</text><text x="400" y="325" font-size="16">devices/+ /ota</text><text x="400" y="380" fill="#b6cde0" font-size="14">QoS 1 events</text>
    <text x="685" y="196" fill="#69e6c1" font-size="19" font-weight="700">REGISTRY</text>
    <text x="685" y="245" font-size="16">Validate identity</text><text x="685" y="285" font-size="16">Store SQLite events</text><text x="685" y="325" font-size="16">Track latest state</text><text x="685" y="380" fill="#b6cde0" font-size="14">local-only by default</text>
    <text x="970" y="196" fill="#69e6c1" font-size="19" font-weight="700">API</text>
    <text x="970" y="250" font-size="17">/health</text><text x="970" y="292" font-size="17">/fleet</text><text x="970" y="350" fill="#b6cde0" font-size="14">dashboard-ready</text>
  </g>
  <g stroke="#69e6c1" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M320 290 H365"/><path d="M605 290 H650"/><path d="M890 290 H935"/></g>
  <rect x="55" y="468" width="1090" height="42" rx="21" fill="#0b1e30" stroke="#284862"/>
  <text x="600" y="495" text-anchor="middle" fill="#b6cde0" font-family="Arial,sans-serif" font-size="16">Smoke test: 1 real device + 3 simulated devices · 12 events · 4 devices tracked</text>
</svg>
